<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lueur - Documents Légaux</title>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #FFFFFF;
            background: #0A0A0A;
            padding: 20px;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Effet fog of war en arrière-plan */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(0, 217, 255, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .lang-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .lang-btn {
            background: #1E1E1E;
            color: #888;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: #2A2A2A;
            color: #FFD700;
            border-color: #FFD700;
        }

        .lang-btn.active {
            background: #FFD700;
            color: #0A0A0A;
            border-color: #FFD700;
            font-weight: 600;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #121212;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow:
                0 0 40px rgba(255, 215, 0, 0.1),
                0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 3em;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .tagline {
            color: #A0A0A0;
            margin-bottom: 50px;
            font-size: 1.1em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #1E1E1E;
            color: #FFD700;
            text-decoration: none;
            padding: 24px 30px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1.1em;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        a::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        a:hover::before {
            width: 300%;
            height: 300%;
        }

        a:hover {
            background: #2A2A2A;
            border-color: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }

        a span {
            position: relative;
            z-index: 1;
        }

        a i {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #333333;
            color: #808080;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 2.2em;
            }

            .tagline {
                font-size: 1em;
            }

            .lang-selector {
                top: 10px;
                right: 10px;
                gap: 5px;
            }

            .lang-btn {
                padding: 6px 12px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="lang-selector">
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/anhpati/lueur-legal/main/lueur-logo.png" alt="Lueur Logo" onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#FFD700;color:#0A0A0A;font-size:2em;font-weight:bold;&quot;>L</div>'">
        </div>
        <h1>Lueur</h1>
        <p class="tagline" id="tagline"></p>

        <div class="links">
            <a href="privacy-policy.html">
                <i data-lucide="shield" style="width: 24px; height: 24px;"></i>
                <span id="link-privacy"></span>
            </a>
            <a href="terms-of-service.html">
                <i data-lucide="scroll-text" style="width: 24px; height: 24px;"></i>
                <span id="link-terms"></span>
            </a>
            <a href="data-deletion.html">
                <i data-lucide="trash-2" style="width: 24px; height: 24px;"></i>
                <span id="link-deletion"></span>
            </a>
        </div>

        <div class="footer">
            <p>© <script>document.write(new Date().getFullYear())</script> Lueur. <span id="footer-rights"></span></p>
        </div>
    </div>

    <script>
        const translations = {
            fr: {
                tagline: "Explorez le monde, révélez votre carte personnelle",
                linkPrivacy: "Politique de Confidentialité",
                linkTerms: "Conditions d'Utilisation",
                linkDeletion: "Suppression des Données",
                footerRights: "Tous droits réservés."
            },
            en: {
                tagline: "Explore the world, reveal your personal map",
                linkPrivacy: "Privacy Policy",
                linkTerms: "Terms of Service",
                linkDeletion: "Data Deletion",
                footerRights: "All rights reserved."
            },
            es: {
                tagline: "Explora el mundo, revela tu mapa personal",
                linkPrivacy: "Política de Privacidad",
                linkTerms: "Condiciones de Uso",
                linkDeletion: "Eliminación de Datos",
                footerRights: "Todos los derechos reservados."
            }
        };

        // Detect browser language
        function detectLanguage() {
            const saved = localStorage.getItem('lueur-lang');
            if (saved && translations[saved]) return saved;

            const browserLang = navigator.language.toLowerCase().split('-')[0];
            return translations[browserLang] ? browserLang : 'fr';
        }

        // Update content
        function updateContent(lang) {
            const t = translations[lang];
            document.documentElement.lang = lang;
            document.getElementById('tagline').textContent = t.tagline;
            document.getElementById('link-privacy').textContent = t.linkPrivacy;
            document.getElementById('link-terms').textContent = t.linkTerms;
            document.getElementById('link-deletion').textContent = t.linkDeletion;
            document.getElementById('footer-rights').textContent = t.footerRights;

            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Save preference
            localStorage.setItem('lueur-lang', lang);
        }

        // Language selector
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                updateContent(btn.dataset.lang);
            });
        });

        // Initialize
        updateContent(detectLanguage());
        lucide.createIcons();
    </script>
</body>
</html>
