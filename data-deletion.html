<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppression des Données - Lueur</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; line-height: 1.6; color: #FFFFFF; background: #0A0A0A; padding: 20px; }
        .lang-selector { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; }
        .lang-btn { background: #1E1E1E; color: #888; border: 1px solid #333; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.3s ease; }
        .lang-btn:hover { background: #2A2A2A; color: #FFD700; border-color: #FFD700; }
        .lang-btn.active { background: #FFD700; color: #0A0A0A; border-color: #FFD700; font-weight: 600; }
        .container { max-width: 800px; margin: 0 auto; background: #121212; padding: 40px; border-radius: 16px; box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), 0 4px 20px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 215, 0, 0.1); }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
        .logo-container { width: 48px; height: 48px; border-radius: 10px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #FFD700; font-size: 2em; text-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
        .last-updated { color: #888; font-size: 0.9em; margin-bottom: 30px; }
        h2 { color: #FFD700; margin-top: 30px; margin-bottom: 15px; font-size: 1.5em; text-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        p { margin-bottom: 15px; color: #A0A0A0; }
        ol { margin-left: 20px; margin-bottom: 15px; color: #A0A0A0; }
        li { margin-bottom: 12px; }
        strong { color: #FFFFFF; }
        a { color: #FFD700; text-decoration: none; }
        a:hover { text-decoration: underline; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .info-box { background: #1E1E1E; padding: 20px; border-radius: 12px; margin: 20px 0; border-left: 4px solid #FFD700; }
        .info-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .info-header h2 { margin: 0; color: #FFD700; }
        .info-header i { color: #FFD700; }
        .warning { background: #2d1f1f; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #dc2626; }
        .warning-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .warning-header h2 { margin: 0; color: #dc2626; }
        .warning-header i { color: #dc2626; }
        .contact { background: #1E1E1E; padding: 20px; border-radius: 12px; margin-top: 30px; border-left: 4px solid #FFD700; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #333; text-align: center; color: #666; font-size: 0.9em; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #888; font-size: 0.9em; }
        .back-link:hover { color: #FFD700; }
        @media (max-width: 600px) {
            .container { padding: 24px; }

            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .lang-selector { top: 10px; right: 10px; gap: 5px; }

</head>
<body>
    <div class="lang-selector">

        </div>
        <p class="last-updated" id="last-updated"></p>

        <div id="content"></div>

        <div class="contact">

        </div>

        <div class="footer">

                    <p><strong>Lueur</strong> almacena todos tus datos <strong>localmente en tu dispositivo</strong>. No se transmiten datos a nuestros servidores porque no usamos ningún servidor.</p>

                contactTitle: "¿Preguntas?",
                contactText: `Si tienes preguntas sobre la eliminación de datos o nuestra política de privacidad:<br><br><strong>Email:</strong> <a href="mailto:anhpati@gmail.com">anhpati@gmail.com</a><br><strong>Política de Privacidad:</strong> <a href="privacy-policy.html">Leer la política completa</a>`,
                footerRights: "Todos los derechos reservados."
            }
        };

        function detectLanguage() {
            const saved = localStorage.getItem('lueur-lang');
            if (saved && t[saved]) return saved;
            const browserLang = navigator.language.toLowerCase().split('-')[0];
            return t[browserLang] ? browserLang : 'fr';
        }

        function updateContent(lang) {
            const trans = t[lang];
            document.documentElement.lang = lang;
            document.getElementById('back-link').textContent = trans.backLink;
            document.getElementById('title').textContent = trans.title;
            document.getElementById('last-updated').textContent = trans.lastUpdated;
            document.getElementById('content').innerHTML = trans.content;
            document.getElementById('contact-title').textContent = trans.contactTitle;
            document.getElementById('contact-text').innerHTML = trans.contactText;
            document.getElementById('footer-rights').textContent = trans.footerRights;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            localStorage.setItem('lueur-lang', lang);
            lucide.createIcons();
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => updateContent(btn.dataset.lang));
        });

        updateContent(detectLanguage());
    </script>
</body>
</html>
